# Test/presentation deployment: frontend only. No backend, worker or database provisioning.
services:
  - type: web
    name: careerlens-frontend-demo
    runtime: python
    plan: free
    region: singapore
    branch: sub-main/withandwithout
    autoDeployTrigger: "off"
    buildCommand: python -m pip install -r requirements.txt
    startCommand: python server.py --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: BACKEND_URL
        sync: false
      - key: PYTHONUNBUFFERED
        value: "1"
