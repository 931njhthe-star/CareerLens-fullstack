# Historical frontend-only preview. Full member/guest/multi-user deployment:
# infra/deploy/compose.yaml (API, worker, shared Redis, persistent guest storage).
# This preview alone does NOT provide guest analysis or shared monitoring.
services:
  - type: web
    name: careerlens-frontend-demo
    runtime: python
    plan: free
    region: singapore
    branch: sub-main/withandwithout
    autoDeployTrigger: "off"
    buildCommand: python -m pip install -r requirements.txt
    startCommand: python server.py --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: BACKEND_URL
        sync: false
      - key: PYTHONUNBUFFERED
        value: "1"
