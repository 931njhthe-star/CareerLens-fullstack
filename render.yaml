services:
  - type: web
    name: careerlens-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: careerlens-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: APP_ENV
        value: production
      - key: AUTH_ENABLED
        value: 'true'

databases:
  - name: careerlens-db
    databaseName: careerlens
    user: careerlens
    postgresMajorVersion: '17'
